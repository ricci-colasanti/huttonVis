<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daisyworld Cellular Automata</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #eeeeee;
                width: 100vw;
                height: 100vh;
            }
            canvas {
                display: block;
                border: none;
                width: 100%;
                height: 100%;
            }
            /* Data Panel */
            #dataPanel {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(4px);
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
                z-index: 100;
                width: 50vh;
                height: 50vh;
                max-height: 50vh;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                display: none;
            }

            #dataPanel.visible {
                display: flex;
            }
            #dataPanel .data-item {
                width: 100%;
                padding: 10px 0;
            }
            #dataPanel .label {
                font-weight: bold;
                opacity: 0.7;
                font-size: clamp(14px, 3vh, 240px);
            }
            #dataPanel .value {
                font-size: clamp(24px, 6vh, 240px);
                font-weight: 300;
                letter-spacing: 1px;
            }
            #dataPanel .value.temperature {
                color: #e74c3c;
            }
            #dataPanel .value.luminosity {
                color: #f39c12;
            }
            /* Hide scrollbar */
            #dataPanel::-webkit-scrollbar {
                display: none;
            }
            #dataPanel {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            /* Toggle hint */
            #toggleHint {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(0, 0, 0, 0.6);
                font-family: Arial, Helvetica, sans-serif;
                font-size: 14px;
                z-index: 50;
                pointer-events: none;
                transition: opacity 0.5s;
                background: rgba(255, 255, 255, 0.8);
                padding: 6px 14px;
                border-radius: 20px;
            }
            #toggleHint.hidden {
                opacity: 0;
            }
            /* Speed control hint */
            #speedHint {
                position: absolute;
                bottom: 60px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(0, 0, 0, 0.8);
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                z-index: 50;
                pointer-events: none;
                background: rgba(255, 255, 255, 0.8);
                padding: 4px 12px;
                border-radius: 16px;
                opacity: 0;
                transition: opacity 0.8s;
            }
            #speedHint.visible {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <!-- Data Panel -->
        <div id="dataPanel">
            <div class="data-item">
                <div class="label">GLOBAL TEMPERATURE</div>
                <div class="value temperature" id="tempDisplay">0.0 &deg;C</div>
            </div>
            <div class="data-item">
                <div class="label">SOLAR LUMINOSITY</div>
                <div class="value luminosity" id="luminosityDisplay">0.00</div>
            </div>
        </div>

        <!-- Toggle hint -->
        <div id="toggleHint">press <strong>D</strong> to toggle data</div>

        <!-- Speed hint -->
        <div id="speedHint"><strong>SPACE</strong> to pause/resume &bull; <strong>I</strong> to step once</div>

        <canvas id="daisyGrid"></canvas>

        <script type="module">
            import CACanvas from "./ca-canvas.js";
            import Grid from "./daisy-world.js";

            const canvasElement = document.getElementById("daisyGrid");
            const caCanvas = new CACanvas(canvasElement, 30);

            const whiteDaisy = new Image();
            const blackDaisy = new Image();

            whiteDaisy.src = "img/white.png";
            blackDaisy.src = "img/black.png";

            let cellSize;
            let gridInstance;
            let dataPanelVisible = false;
            let toggle = false;
            let solarLuminosity = 1.0;
            let running = true;
            let animationId = null;
            let speed = 100; // milliseconds per iteration

            // DOM references
            const dataPanel = document.getElementById("dataPanel");
            const tempDisplay = document.getElementById("tempDisplay");
            const luminosityDisplay = document.getElementById("luminosityDisplay");
            const toggleHint = document.getElementById("toggleHint");
            const speedHint = document.getElementById("speedHint");

            function loadImage(img) {
                return new Promise(function (resolve, reject) {
                    img.onload = function () {
                        resolve(img);
                    };
                    img.onerror = function () {
                        reject(new Error("Failed to load " + img.src));
                    };
                });
            }

            function updateDataPanel() {
                if (!gridInstance) return;

                // Calculate average temperature
                let totalTemp = 0;
                let count = 0;
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.getCell(y, x);
                        totalTemp += cell.temperature;
                        count++;
                    }
                }
                const avgTemp = gridInstance.globalTemperature;

                // Update displays
                tempDisplay.textContent = avgTemp.toFixed(1) + " \u00B0C";
                luminosityDisplay.textContent = solarLuminosity.toFixed(3);
            }

            function toggleDataPanel() {
                dataPanelVisible = !dataPanelVisible;
                if (dataPanelVisible) {
                    dataPanel.classList.add("visible");
                    updateDataPanel();
                    toggle = true;
                    toggleHint.classList.add("hidden");
                } else {
                    dataPanel.classList.remove("visible");
                    toggle = false;
                    toggleHint.classList.remove("hidden");
                }
            }

            function drawGrid() {
                caCanvas.clear();
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.getCell(y, x);
                        const occupant = cell.getStateNow();
                        let img = null;
                        if (occupant === "W") {
                            img = whiteDaisy;
                        }
                        if (occupant === "B") {
                            img = blackDaisy;
                        }
                        const r = Math.floor(((cell.temperature + 20) / 100.0) * 255);
                        const b = Math.floor((1.0 - ((cell.temperature + 20) / 100.0)) * 255);
                        const g = 200;
                        const colour = "rgb(" + r + ", " + g + ", " + b + ")";
                        caCanvas.drawSquareAt(
                            x,
                            y,
                            colour,
                            true
                        );
                        caCanvas.drawImageAt(x, y, img);
                    }
                }

                // Update data panel if visible
                if (dataPanelVisible) {
                    updateDataPanel();
                }
            }

            function handleResize() {
                caCanvas.resizeAndReset();
                gridInstance = new Grid(caCanvas.cols, caCanvas.rows);
                gridInstance.iterate(solarLuminosity);
                gridInstance.populateDaisies();
                drawGrid();
                updateDataPanel();
            }

            function iterate() {
                if (!gridInstance) return;
                gridInstance.iterate(solarLuminosity);
                drawGrid();
                updateDataPanel();
            }

            // Time loop
            function timeLoop() {
                if (running) {
                    iterate();
                }
                // Schedule next iteration
                animationId = setTimeout(timeLoop, speed);
            }

            // Start/stop the time loop
            function toggleRunning() {
                running = !running;
                if (running) {
                    speedHint.textContent = "▶ RUNNING  |  SPACE to pause  |  I to step once";
                    speedHint.classList.add("visible");
                    // Restart the loop if it was stopped
                    if (!animationId) {
                        timeLoop();
                    }
                } else {
                    speedHint.textContent = "⏸ PAUSED  |  SPACE to resume  |  I to step once";
                    speedHint.classList.add("visible");
                    if (animationId) {
                        clearTimeout(animationId);
                        animationId = null;
                    }
                }
            }

            function handleKeyDown(event) {
                if (event.key === "d" || event.key === "D") {
                    event.preventDefault();
                    toggleDataPanel();
                }
                if (toggle && event.key === "ArrowUp") {
                    event.preventDefault();
                    solarLuminosity += 0.01;
                    iterate();
                }
                if (toggle && event.key === "ArrowDown") {
                    event.preventDefault();
                    solarLuminosity -= 0.01;
                    if (solarLuminosity < 0.01) {
                        solarLuminosity = 0.01;
                    }
                    iterate();
                }
                if (event.key === "i" || event.key === "I") {
                    event.preventDefault();
                    iterate();
                }
                if (event.key === " " || event.key === "Space") {
                    event.preventDefault();
                    toggleRunning();
                }
                // Speed control: [ = slower, ] = faster
                if (event.key === "[") {
                    event.preventDefault();
                    speed = Math.min(speed + 50, 1000);
                    if (running) {
                        // Restart loop with new speed
                        if (animationId) {
                            clearTimeout(animationId);
                            animationId = null;
                        }
                        timeLoop();
                    }
                }
                if (event.key === "]") {
                    event.preventDefault();
                    speed = Math.max(speed - 50, 50);
                    if (running) {
                        // Restart loop with new speed
                        if (animationId) {
                            clearTimeout(animationId);
                            animationId = null;
                        }
                        timeLoop();
                    }
                }
            }

            async function init() {
                try {
                    await Promise.all([
                        loadImage(whiteDaisy),
                        loadImage(blackDaisy)
                    ]);
                } catch (err) {
                    console.error(err.message);
                    return;
                }
                caCanvas.resizeAndReset();
                window.addEventListener("resize", handleResize);
                window.addEventListener("keydown", handleKeyDown);
                handleResize();

                // Show speed hint
                speedHint.classList.add("visible");
                setTimeout(() => {
                    speedHint.classList.remove("visible");
                }, 5000);

                // Start the time loop
                timeLoop();

                // Auto-hide hint after 5 seconds
                setTimeout(function() {
                    if (!dataPanelVisible) {
                        toggleHint.style.opacity = "0";
                        setTimeout(function() {
                            toggleHint.style.display = "none";
                        }, 500);
                    }
                }, 5000);
            }
            init();
        </script>
    </body>
</html>
